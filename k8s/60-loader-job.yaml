# Loads the synthetic TR FAST sample data (sample-data) through the orchestration REST API with a
# client-credentials token for demo-loader.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-loader
  namespace: bpo-demo-ms
  labels: {app.kubernetes.io/name: demo-loader, app.kubernetes.io/part-of: bpo-demo}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: demo-loader, app.kubernetes.io/part-of: bpo-demo}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loader
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command: ["sh", "/scripts/load.sh"]
          env:
            - {name: BPO_DEMO_BASE, value: "http://camunda-zeebe-gateway:8080"}
            - {name: BPO_DEMO_TOKEN_URL, value: "https://keycloak:8443/auth/realms/camunda-platform/protocol/openid-connect/token"}
            - name: CRED
              valueFrom: {secretKeyRef: {name: demo-clients, key: demo-loader}}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: models, mountPath: /models}
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: demo-loader}
        - name: models
          configMap: {name: demo-models}
        - name: data
          configMap: {name: demo-scenarios}
        - name: tls
          secret: {secretName: demo-tls-ca}
        - {name: tmp, emptyDir: {}}
