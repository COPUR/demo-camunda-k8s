apiVersion: v1
kind: ServiceAccount
metadata:
  name: bpo-worker-payments
  namespace: bpo-demo-ms
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpo-worker-payments
  namespace: bpo-demo-ms
  labels: {app.kubernetes.io/name: bpo-worker-payments, app.kubernetes.io/part-of: bpo-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: bpo-worker-payments}
  template:
    metadata:
      labels: {app.kubernetes.io/name: bpo-worker-payments, app.kubernetes.io/part-of: bpo-demo}
    spec:
      serviceAccountName: bpo-worker-payments
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bpo-worker-payments
          image: bpo-payments-demo:local
          imagePullPolicy: Never
          env:
            - {name: BPO_DEMO_ACK, value: synthetic-data-only}
            - {name: JAVA_TOOL_OPTIONS, value: "-Djavax.net.ssl.trustStore=/tls-ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12"}
            - {name: BPO_DEMO_ROLE, value: worker}
            - {name: BPO_PROVIDER_PSG_TR_URL, value: "https://sim-psg-tr:8443/"}
            - {name: BPO_PROVIDER_ACC_URL, value: "https://sim-acc:8443/"}
            - {name: BPO_PROVIDER_PAY_URL, value: "https://sim-pay:8443/"}
            - {name: BPO_PROVIDER_NTF_URL, value: "https://sim-ntf:8443/"}
            - {name: BPO_AUTH_TOKEN_URI, value: "https://keycloak:8443/auth/realms/camunda-platform/protocol/openid-connect/token"}
            - {name: BPO_AUTH_SCOPE_PSG_TR, value: aud-svc-psg-tr}
            - {name: BPO_AUTH_SCOPE_ACC, value: aud-svc-acc-accounts-ledger}
            - {name: BPO_AUTH_SCOPE_PAY, value: aud-svc-pay-initiation-settlement}
            - {name: BPO_AUTH_SCOPE_NTF, value: aud-svc-ntf}
            - name: BPO_AUTH_CLIENT_CREDENTIAL
              valueFrom: {secretKeyRef: {name: demo-clients, key: svc-bpo-worker-payments}}
            - {name: CAMUNDA_CLIENT_MODE, value: self-managed}
            - {name: CAMUNDA_CLIENT_REST_ADDRESS, value: "http://camunda-zeebe-gateway:8080"}
            - {name: CAMUNDA_CLIENT_GRPC_ADDRESS, value: "http://camunda-zeebe-gateway:26500"}
            - {name: CAMUNDA_CLIENT_AUTH_METHOD, value: oidc}
            - {name: CAMUNDA_CLIENT_AUTH_CLIENT_ID, value: svc-bpo-worker-payments}
            - name: CAMUNDA_CLIENT_AUTH_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: demo-clients, key: svc-bpo-worker-payments}}
            - {name: CAMUNDA_CLIENT_AUTH_TOKEN_URL, value: "https://keycloak:8443/auth/realms/camunda-platform/protocol/openid-connect/token"}
            - {name: CAMUNDA_CLIENT_AUTH_AUDIENCE, value: orchestration-api}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls-ca, mountPath: /tls-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls-ca
          secret: {secretName: demo-tls-ca}
        - {name: tmp, emptyDir: {}}
