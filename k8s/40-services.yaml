# The demo's own services, one Deployment, Service and ServiceAccount each: the four simulated providers
# (psg-tr, acc, pay, ntf), each an HTTPS front door that checks the caller's Keycloak token, and the real payments
# workers on their deployed path. All run from the locally built image bpo-payments-demo:local (never pushed);
# BPO_DEMO_ROLE picks the service.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sim-psg-tr
  namespace: bpo-demo-ms
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: sim-psg-tr
  namespace: bpo-demo-ms
  labels: {app.kubernetes.io/name: sim-psg-tr, app.kubernetes.io/part-of: bpo-demo}
spec:
  selector: {app.kubernetes.io/name: sim-psg-tr}
  ports:
    - {name: https, port: 8443, targetPort: 8443}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-psg-tr
  namespace: bpo-demo-ms
  labels: {app.kubernetes.io/name: sim-psg-tr, app.kubernetes.io/part-of: bpo-demo, bpo.demo/role: provider-simulator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sim-psg-tr}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sim-psg-tr, app.kubernetes.io/part-of: bpo-demo, bpo.demo/role: provider-simulator}
    spec:
      serviceAccountName: sim-psg-tr
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sim-psg-tr
          image: bpo-payments-demo:local
          imagePullPolicy: Never
          env:
            - {name: BPO_DEMO_ACK, value: synthetic-data-only}
            - {name: JAVA_TOOL_OPTIONS, value: "-Djavax.net.ssl.trustStore=/tls-ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12"}
            - {name: BPO_DEMO_ROLE, value: psg-tr}
            - {name: BPO_DEMO_TOKEN_ISSUER, value: "http://localhost:18080/auth/realms/camunda-platform"}
            - {name: BPO_DEMO_JWKS_URI, value: "https://keycloak:8443/auth/realms/camunda-platform/protocol/openid-connect/certs"}
            - {name: BPO_DEMO_ALLOWED_CALLER, value: svc-bpo-worker-payments}
            - {name: BPO_DEMO_TLS_CERT, value: /tls/tls.crt}
            - {name: BPO_DEMO_TLS_KEY, value: /tls/tls.key}
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tls-ca, mountPath: /tls-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: scenarios, mountPath: /config, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: demo-tls-sim-psg-tr}
        - name: tls-ca
          secret: {secretName: demo-tls-ca}
        - {name: tmp, emptyDir: {}}
        - name: scenarios
          configMap: {name: demo-scenarios}
---
