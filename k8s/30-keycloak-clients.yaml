# Adds the demo's service clients to realm camunda-platform once Management Identity has created it:
#   svc-bpo-worker-payments    client credentials; default audience orchestration-api, optional audiences of the
#                              four providers (requested per call through BPO_AUTH_SCOPE)
#   demo-loader                client credentials; audience orchestration-api only
#   svc-payment-exception-api  the exception API's own client towards Camunda; audience orchestration-api only
#   demo-exception-raiser      calls the exception API: audience payment-exception-api, scopes exceptions:raise and
#                              exceptions:read
#   demo-ops-reviewer          calls it as a member of group pay-tr-fast-ops: audience payment-exception-api, scopes
#                              exceptions:read and exceptions:decide, and the groups claim
#   demo-supervisor-reviewer   the same, as a member of group pay-tr-fast-supervisor
# The reviewers are service accounts only so the demo needs no browser flow; people would sign in to an ops UI
# (authorization code with PKCE) and carry the same audience, scopes and groups.
# Re-running it is safe: existing scopes are kept and existing clients get the current secret. The Keycloak
# image has bash but no awk or jq, so the script uses bash only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-clients
  namespace: bpo-demo-ms
data:
  clients.sh: |
    #!/bin/bash
    set -euo pipefail
    kc() { /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm.config; }
    realm=camunda-platform
    until kc config credentials --server http://keycloak:18080/auth --realm master --user kc-admin --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; do sleep 5; done
    until kc get "realms/$realm" >/dev/null 2>&1; do echo "waiting for realm $realm"; sleep 5; done

    scope_id() {
      kc get client-scopes -r "$realm" --fields id,name --format csv --noquotes \
        | while IFS=, read -r scope_id scope_name; do [ "$scope_name" = "$1" ] && echo "$scope_id"; done || true
    }

    scope() {
      local name=$1 audience=$2 id
      id=$(scope_id "$name")
      if [ -z "$id" ]; then
        id=$(kc create client-scopes -r "$realm" -s name="$name" -s protocol=openid-connect -i)
        kc create "client-scopes/$id/protocol-mappers/models" -r "$realm" -s name=audience -s protocol=openid-connect \
          -s protocolMapper=oidc-audience-mapper -s 'config."included.custom.audience"='"$audience" \
          -s 'config."access.token.claim"=true' -s 'config."id.token.claim"=false' >/dev/null
      fi
      echo "$id"
    }

    client() {
      local client_id=$1 secret=$2 id
      id=$(kc get clients -r "$realm" -q clientId="$client_id" --fields id --format csv --noquotes)
      if [ -z "$id" ]; then
        id=$(kc create clients -r "$realm" -s clientId="$client_id" -s publicClient=false -s serviceAccountsEnabled=true \
          -s standardFlowEnabled=false -s directAccessGrantsEnabled=false -s implicitFlowEnabled=false -s secret="$secret" -i)
      else
        kc update "clients/$id" -r "$realm" -s secret="$secret"
      fi
      echo "$id"
    }

    # A scope with no mapper: Keycloak names it in the token's scope claim, which the API reads as its permission.
    plain_scope() {
      local id
      id=$(scope_id "$1")
      [ -n "$id" ] || id=$(kc create client-scopes -r "$realm" -s name="$1" -s protocol=openid-connect -i)
      echo "$id"
    }

    # The groups claim (group paths, e.g. /pay-tr-fast-ops) the API routes decisions by; not named in scope.
    groups_scope() {
      local id
      id=$(scope_id payment-exception-groups)
      if [ -z "$id" ]; then
        id=$(kc create client-scopes -r "$realm" -s name=payment-exception-groups -s protocol=openid-connect \
          -s 'attributes."include.in.token.scope"=false' -i)
        kc create "client-scopes/$id/protocol-mappers/models" -r "$realm" -s name=groups -s protocol=openid-connect \
          -s protocolMapper=oidc-group-membership-mapper -s 'config."claim.name"=groups' -s 'config."full.path"=true' \
          -s 'config."access.token.claim"=true' -s 'config."id.token.claim"=false' -s 'config."userinfo.token.claim"=false' >/dev/null
      fi
      echo "$id"
    }

    group() {
      local id
      id=$(kc get groups -r "$realm" -q search="$1" --fields id,name --format csv --noquotes \
        | while IFS=, read -r group_id group_name; do [ "$group_name" = "$1" ] && echo "$group_id"; done || true)
      [ -n "$id" ] || id=$(kc create groups -r "$realm" -s name="$1" -i)
      echo "$id"
    }

    # Puts a client's service account user into a group (adding a membership it has is a no-op).
    member() {
      local user
      user=$(kc get "clients/$1/service-account-user" -r "$realm" --fields id --format csv --noquotes)
      kc update "users/$user/groups/$2" -r "$realm" -s realm="$realm" -s userId="$user" -s groupId="$2" -n
    }

    orchestration=$(scope aud-orchestration-api orchestration-api)
    worker=$(client svc-bpo-worker-payments "$WORKER_SECRET")
    loader=$(client demo-loader "$LOADER_SECRET")
    for id in "$worker" "$loader"; do kc update "clients/$id/default-client-scopes/$orchestration" -r "$realm"; done
    for provider in svc-psg-tr svc-acc-accounts-ledger svc-pay-initiation-settlement svc-ntf; do
      kc update "clients/$worker/optional-client-scopes/$(scope "aud-$provider" "$provider")" -r "$realm"
    done

    api=$(client svc-payment-exception-api "$API_SECRET")
    kc update "clients/$api/default-client-scopes/$orchestration" -r "$realm"
    api_audience=$(scope aud-payment-exception-api payment-exception-api)
    read_scope=$(plain_scope exceptions:read)
    raise_scope=$(plain_scope exceptions:raise)
    decide_scope=$(plain_scope exceptions:decide)
    groups_claim=$(groups_scope)
    raiser=$(client demo-exception-raiser "$RAISER_SECRET")
    for sid in "$api_audience" "$raise_scope" "$read_scope"; do kc update "clients/$raiser/default-client-scopes/$sid" -r "$realm"; done
    ops=$(client demo-ops-reviewer "$OPS_REVIEWER_SECRET")
    supervisor=$(client demo-supervisor-reviewer "$SUPERVISOR_REVIEWER_SECRET")
    for id in "$ops" "$supervisor"; do
      for sid in "$api_audience" "$read_scope" "$decide_scope" "$groups_claim"; do
        kc update "clients/$id/default-client-scopes/$sid" -r "$realm"
      done
    done
    member "$ops" "$(group pay-tr-fast-ops)"
    member "$supervisor" "$(group pay-tr-fast-supervisor)"
    echo "service clients ready in realm $realm"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-clients
  namespace: bpo-demo-ms
  labels: {app.kubernetes.io/name: keycloak-clients, app.kubernetes.io/part-of: bpo-demo}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak-clients, app.kubernetes.io/part-of: bpo-demo}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clients
          image: keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
          command: ["/bin/bash", "/scripts/clients.sh"]
          env:
            - {name: HOME, value: /tmp}
            - name: KC_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: demo-keycloak, key: admin-password}}
            - name: WORKER_SECRET
              valueFrom: {secretKeyRef: {name: demo-clients, key: svc-bpo-worker-payments}}
            - name: LOADER_SECRET
              valueFrom: {secretKeyRef: {name: demo-clients, key: demo-loader}}
            - name: API_SECRET
              valueFrom: {secretKeyRef: {name: demo-api-clients, key: svc-payment-exception-api}}
            - name: RAISER_SECRET
              valueFrom: {secretKeyRef: {name: demo-api-clients, key: demo-exception-raiser}}
            - name: OPS_REVIEWER_SECRET
              valueFrom: {secretKeyRef: {name: demo-api-clients, key: demo-ops-reviewer}}
            - name: SUPERVISOR_REVIEWER_SECRET
              valueFrom: {secretKeyRef: {name: demo-api-clients, key: demo-supervisor-reviewer}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: keycloak-clients}
        - {name: tmp, emptyDir: {}}
