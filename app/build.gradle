plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.1.1' apply false
}

description = 'demo-camunda-k8s - TR FAST P2 workers and provider simulators for the Camunda 8.10 Kubernetes demo'

// The engine version here and the chart in helm/chart-lock.yaml move together.
ext {
    springBootVersion = '4.1.1'
    camundaVersion = '8.10.4'
    archunitVersion = '1.4.1'
}

allprojects {
    group = 'com.fintechbankx'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(23)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "io.camunda:camunda-bom:${camundaVersion}"
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
