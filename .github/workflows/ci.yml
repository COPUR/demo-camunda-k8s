name: ci
# Lint only; nothing here reaches a cluster. Never set the CI_RUNNER variable if this repository is made public:
# fork pull requests would then run on that self-hosted machine.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Shell scripts parse and pass shellcheck
        run: |
          for f in install.sh open.sh status.sh uninstall.sh lib/common.sh sample-data/load.sh; do bash -n "$f"; done
          shellcheck -x -s bash install.sh open.sh status.sh uninstall.sh lib/common.sh
          shellcheck -s sh sample-data/load.sh
      - name: Manifests are valid YAML
        run: python3 -c 'import sys,yaml; [list(yaml.safe_load_all(open(f))) for f in sys.argv[1:]]' k8s/*.yaml helm/*.yaml
      - name: Helm v3.16.3 (pinned per architecture; the self-hosted VM does not ship it)
        run: |
          case "$(uname -m)" in
            x86_64)  arch=amd64; sha=f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea ;;
            aarch64|arm64) arch=arm64; sha=5bd34ed774df6914b323ff84a0a156ea6ff2ba1eaf0113962fa773f3f9def798 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          f="helm-v3.16.3-linux-$arch.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://get.helm.sh/$f"
          echo "$sha  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/helm-bin" --strip-components=1 "linux-$arch/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - name: Pinned chart matches its sha256 and renders with the demo values
        run: |
          url=$(sed -n 's/^url: //p' helm/chart-lock.yaml); sha=$(sed -n 's/^sha256: //p' helm/chart-lock.yaml)
          curl -sSfL -o chart.tgz "$url"
          echo "$sha  chart.tgz" | sha256sum -c -
          helm template camunda chart.tgz -n bpo-demo-ms -f helm/values-camunda.yaml > /dev/null
