name: ci
# Lint, and the build and tests of app/; nothing here reaches a cluster. Pull requests run on GitHub-hosted runners;
# only pushes to main use the machine vars.CI_RUNNER names (the self-hosted runner), when it is set. A pull request
# can still edit this file, so before this repository is made public, remove that runner or make every outside
# collaborator's workflow run wait for approval (Settings > Actions). No job keeps the checkout's token.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ${{ (github.event_name == 'push' && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Shell scripts parse and pass shellcheck
        run: |
          for f in demo.sh install.sh open.sh status.sh uninstall.sh api.sh lib/common.sh app/payment-exception-api/e2e/run.sh \
              sample-data/load.sh sample-data/api-check.sh; do bash -n "$f"; done
          shellcheck -x -s bash demo.sh install.sh open.sh status.sh uninstall.sh api.sh lib/common.sh app/payment-exception-api/e2e/run.sh
          shellcheck -s sh sample-data/load.sh sample-data/api-check.sh
      - name: Manifests are valid YAML
        run: python3 -c 'import sys,yaml; [list(yaml.safe_load_all(open(f))) for f in sys.argv[1:]]' k8s/*.yaml helm/*.yaml
      - name: The Keycloak clients script in its ConfigMap parses and passes shellcheck
        run: |
          python3 -c 'import sys,yaml; sys.stdout.write(next(d for d in yaml.safe_load_all(open(sys.argv[1])) if d["kind"] == "ConfigMap")["data"]["clients.sh"])' \
            k8s/30-keycloak-clients.yaml > "$RUNNER_TEMP/clients.sh"
          bash -n "$RUNNER_TEMP/clients.sh"
          shellcheck -s bash "$RUNNER_TEMP/clients.sh"
      - name: Helm v3.16.3 (pinned per architecture; the self-hosted VM does not ship it)
        run: |
          case "$(uname -m)" in
            x86_64)  arch=amd64; sha=f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea ;;
            aarch64|arm64) arch=arm64; sha=5bd34ed774df6914b323ff84a0a156ea6ff2ba1eaf0113962fa773f3f9def798 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          f="helm-v3.16.3-linux-$arch.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://get.helm.sh/$f"
          echo "$sha  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/helm-bin" --strip-components=1 "linux-$arch/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - name: Pinned chart matches its sha256 and renders with the demo values
        run: |
          url=$(sed -n 's/^url: //p' helm/chart-lock.yaml); sha=$(sed -n 's/^sha256: //p' helm/chart-lock.yaml)
          curl -sSfL -o chart.tgz "$url"
          echo "$sha  chart.tgz" | sha256sum -c -
          helm template camunda chart.tgz -n bpo-demo-ms -f helm/values-camunda.yaml > /dev/null

  java:
    # Every Gradle project in app/ with the JDK the image builds with (Temurin 23.0.2+7, app/Dockerfile): unit, web,
    # contract and architecture tests and the payment exception API's 87 % coverage rule. The real-engine tests
    # (app/payment-exception-api/e2e/run.sh) need Docker and a Camunda image, so they stay a manual step.
    runs-on: ${{ (github.event_name == 'push' && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '23.0.2+7'
          cache: gradle
      - name: Build, test and check coverage
        working-directory: app
        run: ./gradlew --no-daemon --console=plain cleanTest check
      - name: Failed tests
        if: failure()
        working-directory: app
        run: |
          shopt -s nullglob
          reports=(*/build/test-results/test/*.xml)
          [ ${#reports[@]} -gt 0 ] || { echo "no test reports: the build failed before any test ran"; exit 0; }
          python3 -I - "${reports[@]}" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              for case in ET.parse(path).iter('testcase'):
                  for problem in list(case.findall('failure')) + list(case.findall('error')):
                      print(f"{case.get('classname')} > {case.get('name')}\n  {(problem.get('message') or '').strip()[:600]}")
          EOF
