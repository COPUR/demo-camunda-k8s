# Camunda 8.10 for the local microservices demo (install.sh), on top of the chart's own defaults.
# Not the target values: those are deploy/camunda-platform/values-*.yaml. Here Keycloak, PostgreSQL and the
# simulated providers run in the same throwaway namespace, every credential is generated by install.sh into a Secret,
# and the browser reaches the UIs on localhost. Image digests are the chart's values-digest.yaml for 15.1.1,
# except the orchestration cluster, which uses the repo's pinned 8.10.4.
global:
  security:
    authentication:
      method: oidc
  identity:
    keycloak:
      url:
        protocol: http
        host: keycloak
        port: "18080"
      contextPath: /auth
      realm: /realms/camunda-platform
      auth:
        adminUser: kc-admin
        secret:
          existingSecret: demo-keycloak
          existingSecretKey: admin-password
    auth:
      enabled: true
      type: KEYCLOAK
      publicIssuerUrl: http://localhost:18080/auth/realms/camunda-platform
      issuerBackendUrl: http://keycloak:18080/auth/realms/camunda-platform
      tokenUrl: http://keycloak:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      jwksUrl: http://keycloak:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
      authUrl: http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/auth
      identity:
        redirectUrl: http://localhost:8084
      webModeler:
        redirectUrl: http://localhost:8070
      orchestration:
        alwaysRegister: true
      connectors:
        alwaysRegister: true

identity:
  enabled: true
  containerSecurityContext:
    capabilities:
      drop: [ALL]
  image:
    repository: camunda/identity
    tag: 8.10.0
    digest: sha256:0a731ff58fb248c7d1bae2cd8e315128100dbbeb547e6a9b4551e8761e43b777
  firstUser:
    enabled: true
    username: presenter
    email: presenter@example.invalid
    firstName: Demo
    lastName: Presenter
    secret:
      existingSecret: demo-presenter
      existingSecretKey: password
  externalDatabase:
    enabled: true
    host: postgres
    port: 5432
    database: identity
    username: identity
    secret:
      existingSecret: demo-postgres
      existingSecretKey: identity

orchestration:
  enabled: true
  containerSecurityContext:
    capabilities:
      drop: [ALL]
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  pvcSize: 2Gi
  image:
    repository: camunda/camunda
    tag: 8.10.4
    digest: sha256:e71bed9297381fe3449ebe2c022264ca62f5a87e95fe3aece42c6f4e1069d139
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
  security:
    authentication:
      method: oidc
      unprotectedApi: false
      oidc:
        redirectUrl: http://localhost:8080
        secret:
          existingSecret: demo-oidc
          existingSecretKey: orchestration
    authorizations:
      enabled: true
    initialization:
      defaultRoles:
        admin:
          users:
            - presenter
          # The worker and the loader get the admin role in this demo only; the target grants each client its
          # own authorizations (docs/identity-requests.md).
          clients:
            - svc-bpo-worker-payments
            - demo-loader
  exporters:
    rdbms:
      enabled: true
  data:
    secondaryStorage:
      type: rdbms
      rdbms:
        url: jdbc:postgresql://postgres:5432/camunda
        username: camunda
        secret:
          existingSecret: demo-postgres
          existingSecretKey: camunda

connectors:
  enabled: true
  containerSecurityContext:
    capabilities:
      drop: [ALL]
  image:
    repository: camunda/connectors-bundle
    tag: 8.10.0
    digest: sha256:9b69993c1b5dae12f887e1c67c32146449472f265cee3148bac79128013da822
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: demo-oidc
          existingSecretKey: connectors
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

camundaHub:
  enabled: true
webModeler:
  restapi:
    containerSecurityContext:
      capabilities:
        drop: [ALL]
    image:
      repository: camunda/hub
      tag: 8.10.2
      digest: sha256:8d2cd1f76d3b9111a70266a44eca3500741a857156caf7d3a5fb28702799c2b9
    externalDatabase:
      host: postgres
      port: 5432
      database: hub
      username: hub
      secret:
        existingSecret: demo-postgres
        existingSecretKey: hub
    mail:
      fromAddress: no-reply@example.invalid
    pusher:
      client:
        secret:
          existingSecret: demo-pusher
          existingSecretKey: app-key
      secret:
        existingSecret: demo-pusher
        existingSecretKey: app-secret
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        memory: 1536Mi
  websockets:
    containerSecurityContext:
      capabilities:
        drop: [ALL]
    image:
      repository: camunda/hub-websockets
      tag: 8.10.2
      digest: sha256:4392c73b2d43b0287e05147b4606c59f1634bc7ac4c15ea4c86217e523cfced1
    publicHost: localhost
    publicPort: 8085

optimize:
  enabled: false
